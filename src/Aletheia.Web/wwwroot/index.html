<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aletheia.Web</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css?v=20260729-copilot29" />
    <link rel="stylesheet" href="css/app.css?v=20260729-copilot29" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Aletheia.Web.styles.css?v=20260729-copilot29" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script>
        window.aletheia = {
            getBaseUri: () => `${window.location.origin}/`,
            copyText: async text => {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    return;
                }

                const textArea = document.createElement('textarea');
                textArea.value = text;
                textArea.setAttribute('readonly', '');
                textArea.style.position = 'fixed';
                textArea.style.left = '-9999px';
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
            },
            startCopilotResize: (dotNetRef, startX, startWidth) => {
                const minWidth = 280;
                const maxWidth = 720;
                const clamp = value => Math.max(minWidth, Math.min(maxWidth, value));
                const onMove = event => {
                    const nextWidth = clamp(startWidth - (event.clientX - startX));
                    dotNetRef.invokeMethodAsync('UpdateExecutionPanelWidth', nextWidth);
                };
                const onUp = event => {
                    onMove(event);
                    document.removeEventListener('pointermove', onMove);
                    document.removeEventListener('pointerup', onUp);
                    document.body.classList.remove('copilot-resizing');
                };

                document.body.classList.add('copilot-resizing');
                document.addEventListener('pointermove', onMove);
                document.addEventListener('pointerup', onUp, { once: true });
            }
        };
    </script>
    <script src="_framework/blazor.webassembly.js?v=20260729-copilot29"></script>
    <script src="https://unpkg.com/cytoscape@3.26.0/dist/cytoscape.min.js"></script>
    <script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
    <script>
        window.downloadFileFromStream = async (fileName, contentStreamReference) => {
            const arrayBuffer = await contentStreamReference.arrayBuffer();
            const blob = new Blob([arrayBuffer]);
            const url = URL.createObjectURL(blob);
            const anchor = document.createElement('a');
            anchor.href = url;
            anchor.download = fileName;
            anchor.click();
            URL.revokeObjectURL(url);
        };

        window.scrollToDocumentElement = (selector) => {
            const el = document.querySelector(selector);
            if (!el) return false;
            el.scrollIntoView({ block: 'center', behavior: 'auto' });
            return true;
        };

        window.renderPdf = async (containerId, streamRef, pageNumber, highlightText) => {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '<div class="pdf-loading">Loading PDF…</div>';

            const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, ch => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[ch]));

            try {
                const arrayBuffer = await streamRef.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                const targetPage = Math.min(Math.max(pageNumber || 1, 1), pdf.numPages);
                const page = await pdf.getPage(targetPage);
                const viewport = page.getViewport({ scale: 1.5 });

                container.innerHTML = '';

                const canvas = document.createElement('canvas');
                canvas.className = 'pdf-canvas';
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                container.appendChild(canvas);
                const ctx = canvas.getContext('2d');
                await page.render({ canvasContext: ctx, viewport }).promise;

                const textLayer = document.createElement('div');
                textLayer.className = 'pdf-text-layer';
                textLayer.style.width = `${viewport.width}px`;
                textLayer.style.height = `${viewport.height}px`;
                container.appendChild(textLayer);

                const textContent = await page.getTextContent();
                const spans = [];
                let fullText = '';

                textContent.items.forEach(item => {
                    if (!item.str) return;
                    const tx = pdfjsLib.Util.transform(viewport.transform, item.transform);
                    const span = document.createElement('span');
                    span.className = 'pdf-text-item';
                    span.textContent = item.str;
                    span.style.left = `${tx[4]}px`;
                    span.style.top = `${tx[5]}px`;
                    const fontSize = Math.hypot(tx[0], tx[1]);
                    span.style.fontSize = `${fontSize}px`;
                    span.style.transform = `scaleX(${fontSize ? tx[0] / fontSize : 1})`;
                    textLayer.appendChild(span);
                    spans.push(span);
                    fullText += item.str;
                });

                if (highlightText) {
                    const needle = highlightText.trim();
                    let found = false;
                    let searchFrom = 0;
                    while (!found && needle) {
                        const idx = fullText.indexOf(needle, searchFrom);
                        if (idx < 0) break;
                        let charCount = 0;
                        const hitSpans = [];
                        for (const span of spans) {
                            const start = charCount;
                            const end = charCount + span.textContent.length;
                            if (end > idx && start < idx + needle.length) {
                                hitSpans.push(span);
                            }
                            charCount = end;
                        }
                        if (hitSpans.length > 0) {
                            hitSpans.forEach(s => s.classList.add('pdf-highlight'));
                            found = true;
                        } else {
                            searchFrom = idx + 1;
                        }
                    }
                    if (!found && spans.length > 0) {
                        spans[0].classList.add('pdf-highlight');
                    }
                }

                const firstHighlight = textLayer.querySelector('.pdf-highlight');
                if (firstHighlight) {
                    firstHighlight.scrollIntoView({ block: 'center', behavior: 'auto' });
                }
            } catch (err) {
                container.innerHTML = `<div class="pdf-error">Could not render this PDF: ${escapeHtml(String(err && err.message || err))}</div>`;
            }
        };

        window.initGraph = (containerId, nodes, edges, dotNetRef, preservePositions) => {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '';
            if (!window.cytoscape) {
                renderFallbackGraph(container, nodes, edges);
                if (dotNetRef) dotNetRef.invokeMethodAsync('OnGraphLayoutSettled');
                return;
            }
            const visualGraph = buildGraphVisuals(nodes, edges);
            const elements = [
                ...visualGraph.nodes.map(n => ({
                    data: {
                        id: n.id,
                        label: n.label,
                        displayLabel: n.label,
                        type: n.type,
                        fillColor: n.fillColor,
                        groupColor: n.groupColor
                    }
                })),
                ...visualGraph.edges.map(e => ({
                    data: {
                        id: e.id,
                        source: e.sourceId,
                        target: e.targetId,
                        label: e.relationshipType,
                        displayLabel: '',
                        edgeColor: e.edgeColor,
                        edgeWidth: e.edgeWidth,
                        relationshipType: e.relationshipType
                    }
                }))
            ];
            const layoutOpts = getGraphLayoutOptions(false);
            if (preservePositions && window.cy) {
                // Scope changes (context selection, chunk toggle) re-render the graph. Keep nodes
                // where they are instead of re-randomizing, so the view does not jump around.
                const oldPositions = {};
                window.cy.nodes().forEach(n => { oldPositions[n.id()] = { x: n.position('x'), y: n.position('y') }; });
                elements.forEach(el => {
                    if (el.data && oldPositions[el.data.id]) {
                        el.position = oldPositions[el.data.id];
                    }
                });
                layoutOpts.randomize = false;
            }
            window.cy = cytoscape({
                container: container,
                elements: elements,
                style: [
                    {
                        selector: 'node',
                        style: {
                            'background-color': 'data(fillColor)',
                            'border-color': 'data(groupColor)',
                            'border-width': 1,
                            'border-opacity': 0.95,
                            'label': 'data(displayLabel)',
                            'width': 50,
                            'height': 50,
                            'font-size': '12px',
                            'text-wrap': 'wrap',
                            'text-max-width': '120px',
                            'text-valign': 'bottom',
                            'text-margin-y': 8,
                            'color': '#111827',
                            'text-outline-width': 3,
                            'text-outline-color': '#ffffff'
                        }
                    },
                    {
                        selector: 'node.important',
                        style: {
                            'font-weight': 700,
                            'border-width': 2
                        }
                    },
                    {
                        selector: 'node:selected, node.hovered',
                        style: {
                            'background-color': '#b45309',
                            'border-color': '#78350f',
                            'border-width': 2
                        }
                    },
                    {
                        selector: 'edge',
                        style: {
                            'width': 'data(edgeWidth)',
                            'line-color': 'data(edgeColor)',
                            'target-arrow-color': 'data(edgeColor)',
                            'target-arrow-shape': 'triangle',
                            'label': 'data(displayLabel)',
                            'font-size': '10px',
                            'text-background-color': '#ffffff',
                            'text-background-opacity': 0.9,
                            'text-background-padding': 2,
                            'text-rotation': 'autorotate',
                            'curve-style': 'bezier'
                        }
                    },
                    {
                        selector: 'edge:selected, edge.hovered',
                        style: {
                            'line-color': '#b45309',
                            'target-arrow-color': '#b45309',
                            'width': 3
                        }
                    }
                ],
                layout: layoutOpts
            });
            configureGraphLabels(window.cy);
            if (dotNetRef) {
                // Tell the page when the layout has settled so it can clear the "preparing graph"
                // overlay. layoutstop fires on the graph once the layout (including animation) ends.
                window.cy.on('layoutstop', () => dotNetRef.invokeMethodAsync('OnGraphLayoutSettled'));
            }

            // Sprint 76: drag a source document and its exclusively-found_in children as one group.
            // A child node joins the group only when EVERY found_in edge it has points to this
            // document — a child found in multiple documents stays put (it is not "solely based
            // on this doc"). Positions persist across re-renders via preservePositions, so a
            // moved cluster stays where the user put it.
            let dragGroup = null;
            let dragStartPositions = null;

            const computeDragGroup = (cy, sourceNode) => {
                const sourceId = sourceNode.id();
                const group = new Set([sourceNode]);
                cy.nodes().forEach(node => {
                    if (node === sourceNode || node.data('type') === 'SourceDocument') return;
                    const foundInEdges = node.connectedEdges().filter(edge => edge.data('relationshipType') === 'found_in');
                    if (foundInEdges.length === 0) return;
                    const exclusivelyInThisSource = foundInEdges.every(edge => {
                        const other = edge.source().id() === node.id() ? edge.target() : edge.source();
                        return other.id() === sourceId;
                    });
                    if (exclusivelyInThisSource) group.add(node);
                });
                return group;
            };

            window.cy.on('grab', 'node', event => {
                const node = event.target;
                if (node.data('type') !== 'SourceDocument') return;
                dragGroup = computeDragGroup(window.cy, node);
                dragStartPositions = new Map();
                dragGroup.forEach(n => dragStartPositions.set(n.id(), { x: n.position('x'), y: n.position('y') }));
            });

            window.cy.on('drag', 'node', event => {
                const node = event.target;
                if (!dragGroup || !dragGroup.has(node)) return;
                const start = dragStartPositions.get(node.id());
                if (!start) return;
                const dx = node.position('x') - start.x;
                const dy = node.position('y') - start.y;
                dragGroup.forEach(n => {
                    if (n === node) return;
                    const s = dragStartPositions.get(n.id());
                    n.position({ x: s.x + dx, y: s.y + dy });
                });
            });

            window.cy.on('free', 'node', () => {
                dragGroup = null;
                dragStartPositions = null;
            });
        };

        function getGraphLayoutOptions(spread) {
            return {
                name: 'cose',
                animate: true,
                animationDuration: 500,
                fit: true,
                padding: 40,
                randomize: true,
                nodeOverlap: spread ? 30 : 12,
                componentSpacing: spread ? 140 : 80,
                nodeRepulsion: () => spread ? 900000 : 450000,
                idealEdgeLength: () => spread ? 180 : 110,
                edgeElasticity: () => spread ? 80 : 120,
                gravity: spread ? 0.18 : 0.35,
                numIter: spread ? 1800 : 1000
            };
        }

        function runGraphLayout(spread) {
            if (!window.cy) return;
            if (window.graphLayout) {
                window.graphLayout.stop();
            }
            window.graphLayout = window.cy.layout(getGraphLayoutOptions(spread));
            window.graphLayout.run();
        }

        window.fitGraph = () => {
            if (!window.cy) return;
            window.cy.resize();
            window.cy.fit(window.cy.elements(), 40);
            window.cy.center();
        };

        // Sprint 76: explicit zoom control. cy.zoom({ level }) fires the 'zoom' event, so the
        // existing zoom-threshold label logic (configureGraphLabels' updateLabels) re-runs at the
        // new scale automatically — the two features compose.
        window.setGraphZoom = (factor) => {
            if (!window.cy) return;
            const clamped = Math.max(0.25, Math.min(3, Number(factor) || 1));
            window.cy.zoom({ level: clamped });
        };

        window.getGraphZoom = () => {
            if (!window.cy) return 1;
            return window.cy.zoom();
        };

        window.relayoutGraph = () => {
            runGraphLayout(false);
        };

        window.spreadGraph = () => {
            runGraphLayout(true);
        };

        function buildGraphVisuals(nodes, edges) {
            const typeColors = {
                SourceDocument: '#0f766e',
                Person: '#2563eb',
                Organization: '#2563eb',
                Technology: '#7c3aed',
                Concept: '#d97706',
                Topic: '#d97706',
                Project: '#16a34a',
                Process: '#16a34a',
                Entity: '#4b5563'
            };
            const groupPalette = ['#ef4444', '#06b6d4', '#84cc16', '#f97316', '#a855f7', '#14b8a6', '#eab308', '#64748b'];
            const nodeById = new Map(nodes.map(node => [node.id, node]));
            const sourceIds = new Set(nodes.filter(node => node.type === 'SourceDocument').map(node => node.id));
            const groupByNode = new Map();
            const groupIndex = new Map();
            const colorForGroup = groupId => {
                if (!groupIndex.has(groupId)) {
                    groupIndex.set(groupId, groupIndex.size);
                }
                return groupPalette[groupIndex.get(groupId) % groupPalette.length];
            };

            edges
                .filter(edge => edge.relationshipType === 'found_in' && sourceIds.has(edge.targetId))
                .forEach(edge => groupByNode.set(edge.sourceId, edge.targetId));

            sourceIds.forEach(sourceId => groupByNode.set(sourceId, sourceId));

            const visualNodes = nodes.map(node => {
                const groupId = groupByNode.get(node.id) ?? node.type ?? 'Other';
                return {
                    ...node,
                    fillColor: typeColors[node.type] ?? '#64748b',
                    groupColor: colorForGroup(groupId)
                };
            });

            const edgeColorByType = {
                found_in: '#cbd5e1',
                co_occurs_with: '#94a3b8',
                relates: '#94a3b8'
            };

            const visualEdges = edges.map(edge => ({
                ...edge,
                edgeColor: edgeColorByType[edge.relationshipType] ?? '#9ca3af',
                edgeWidth: edge.relationshipType === 'found_in' ? 1.25 : 2
            }));

            return { nodes: visualNodes, edges: visualEdges };
        }

        function configureGraphLabels(cy) {
            const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
            const nodeDegrees = cy.nodes().map(node => node.connectedEdges().length).sort((a, b) => b - a);
            const importantDegree = nodeDegrees[Math.min(7, Math.max(0, nodeDegrees.length - 1))] ?? Number.MAX_SAFE_INTEGER;

            cy.nodes().forEach(node => {
                if (node.data('type') === 'SourceDocument' || node.connectedEdges().length >= importantDegree) {
                    node.addClass('important');
                }
            });

            const updateLabels = () => {
                const zoom = cy.zoom();
                const renderedNodeFont = clamp(14, 12, 16);
                const renderedEdgeFont = clamp(11, 10, 13);
                const nodeFont = `${renderedNodeFont / Math.max(zoom, 0.2)}px`;
                const edgeFont = `${renderedEdgeFont / Math.max(zoom, 0.2)}px`;
                const nodeTextWidth = `${Math.round(130 / Math.max(zoom, 0.35))}px`;
                const showAllNodeLabels = zoom >= 0.75;
                const showImportantNodeLabels = zoom >= 0.35;
                const showEdgeLabels = zoom >= 1.25;

                cy.batch(() => {
                    cy.nodes().forEach(node => {
                        const shouldShow =
                            showAllNodeLabels ||
                            node.selected() ||
                            node.hasClass('hovered') ||
                            (showImportantNodeLabels && node.hasClass('important'));

                        node.data('displayLabel', shouldShow ? node.data('label') : '');
                        node.style({
                            'font-size': nodeFont,
                            'text-max-width': nodeTextWidth
                        });
                    });

                    cy.edges().forEach(edge => {
                        const shouldShow = showEdgeLabels || edge.selected() || edge.hasClass('hovered');
                        edge.data('displayLabel', shouldShow ? edge.data('label') : '');
                        edge.style('font-size', edgeFont);
                    });
                });
            };

            cy.on('zoom', updateLabels);
            cy.on('mouseover', 'node, edge', event => {
                event.target.addClass('hovered');
                updateLabels();
            });
            cy.on('mouseout', 'node, edge', event => {
                event.target.removeClass('hovered');
                updateLabels();
            });
            cy.on('select unselect', 'node, edge', updateLabels);
            updateLabels();
        }

        function renderFallbackGraph(container, nodes, edges) {
            if (!nodes || nodes.length === 0) {
                container.innerHTML = '<div style="padding:16px;color:#495057;">No graph nodes loaded.</div>';
                return;
            }

            const width = Math.max(container.clientWidth || 720, 480);
            const height = Math.max(container.clientHeight || 500, 360);
            const radius = Math.min(width, height) * 0.38;
            const centerX = width / 2;
            const centerY = height / 2;
            const positions = new Map();
            const escape = value => String(value ?? '').replace(/[&<>"']/g, ch => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[ch]));

            nodes.forEach((node, index) => {
                const angle = (Math.PI * 2 * index) / nodes.length;
                positions.set(node.id, {
                    x: centerX + Math.cos(angle) * radius,
                    y: centerY + Math.sin(angle) * radius
                });
            });

            const edgeMarkup = (edges || [])
                .map(edge => {
                    const from = positions.get(edge.sourceId);
                    const to = positions.get(edge.targetId);
                    if (!from || !to) return '';
                    return `<line x1="${from.x}" y1="${from.y}" x2="${to.x}" y2="${to.y}" stroke="#8d99a6" stroke-width="1.5" opacity="0.65"><title>${escape(edge.relationshipType)}</title></line>`;
                })
                .join('');

            const nodeMarkup = nodes
                .map(node => {
                    const point = positions.get(node.id);
                    const label = escape(node.label);
                    return `<g><circle cx="${point.x}" cy="${point.y}" r="16" fill="#1f6feb"><title>${label} (${escape(node.type)})</title></circle><text x="${point.x}" y="${point.y + 30}" text-anchor="middle" font-size="11" fill="#212529">${label}</text></g>`;
                })
                .join('');

            container.innerHTML = `<svg viewBox="0 0 ${width} ${height}" width="100%" height="100%" role="img" aria-label="Knowledge graph">${edgeMarkup}${nodeMarkup}</svg>`;
        }
    </script>
</body>

</html>
